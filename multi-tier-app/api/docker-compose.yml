services:
  proxy:
    image: nginx:alpine
    container_name: proxy_ingress
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - api

  api:
    build: ./api
    container_name: api_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://appuser:secretpassword@db:5432/appdb
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    networks:
      - backend-net
      - data-net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: db_store
    restart: unless-stopped
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  cache:
    image: redis:7-alpine
    container_name: cache_store
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - data-net

volumes:
  postgres_data:
  redis_data:

networks:
  frontend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
  backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24
  data-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.3.0/24
